name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tofu_version: latest
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: dummy-test-token-12345
          tofu_wrapper: 'false'
      - name: Assert tofu is installed
        run: |
          echo "Checking tofu binary is available..."
          if ! command -v tofu >/dev/null 2>&1; then
            echo "FAIL: tofu binary not found in PATH"
            exit 1
          fi
          VERSION=$(tofu version)
          echo "tofu version: $VERSION"
          echo "PASS: tofu is installed"
      - name: Assert credentials config was written
        run: |
          echo "Checking OpenTofu CLI credentials config..."
          # The credentials block should be written to the CLI config file
          # Typical locations: ~/.terraformrc or ~/.tofurc
          FOUND=0
          for cfg in "$HOME/.tofurc" "$HOME/.terraformrc"; do
            if [ -f "$cfg" ]; then
              echo "Found config file: $cfg"
              cat "$cfg"
              if grep -q "dummy-test-token-12345" "$cfg"; then
                echo "PASS: credentials token found in $cfg"
                FOUND=1
                break
              fi
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: credentials token not found in any CLI config file"
            exit 1
          fi
