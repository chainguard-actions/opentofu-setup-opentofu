name: Test specific OpenTofu version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tofu_version: '1.6.0'
          tofu_wrapper: 'true'
          github_token: ${{ github.token }}
      - name: Assert tofu binary is on PATH
        run: |
          which tofu
          echo "PASS: tofu found at $(which tofu)"
      - name: Assert installed version matches requested version
        run: |
          OUTPUT=$(tofu --version)
          echo "tofu version output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "1.6.0"; then
            echo "PASS: tofu version 1.6.0 is installed"
          else
            echo "FAIL: expected version 1.6.0 but got: $OUTPUT"
            exit 1
          fi
